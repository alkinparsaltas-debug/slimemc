name: Build Slime Client 26.2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Resolve Fabric 26.2 versions
        working-directory: mod
        run: |
          python3 -c '
          import json, urllib.request, urllib.parse
          try:
              loaders = json.loads(urllib.request.urlopen("https://meta.fabricmc.net/v2/versions/loader/26.2").read())
              loader_ver = loaders[0]["loader"]["version"]
              q = urllib.parse.quote("[\"26.2\"]")
              apis = json.loads(urllib.request.urlopen(f"https://api.modrinth.com/v2/project/fabric-api/version?game_versions={q}").read())
              api_ver = apis[0]["version_number"]
              with open("gradle.properties", "r") as f:
                  txt = f.read()
              lines = []
              for line in txt.splitlines():
                  if line.startswith("loader_version="):
                      lines.append(f"loader_version={loader_ver}")
                  elif line.startswith("fabric_version="):
                      lines.append(f"fabric_version={api_ver}")
                  else:
                      lines.append(line)
              with open("gradle.properties", "w") as f:
                  f.write("\n".join(lines) + "\n")
          except Exception as e:
              print("Fallback to default versions:", e)
          '
      - name: Build SlimeClient 26.2 Mod JAR
        working-directory: mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: slime-mod-jar
          path: mod/build/libs/SlimeClient-26.2-*.jar
          if-no-files-found: warn

  build-windows-exe:
    needs: build-mod
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: slime-mod-jar
          path: launcher/
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: launcher
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        working-directory: launcher
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Filter "SlimeClient-26.2-*.jar" | Where-Object { $_.Name -notlike "*-sources.jar" } | Select-Object -First 1
          if ($jar) { Copy-Item $jar.FullName -Destination "SlimeClient-26.2.jar" -Force }
          pyinstaller --noconfirm --onefile --windowed --name "SlimeLauncher" slime_launcher.py
          if (Test-Path "SlimeClient-26.2.jar") {
            pyinstaller --noconfirm --onefile --windowed --name "SlimeClient-Setup" --add-data "dist\SlimeLauncher.exe;." --add-data "SlimeClient-26.2.jar;." slime_setup_wizard.py
          } else {
            pyinstaller --noconfirm --onefile --windowed --name "SlimeClient-Setup" --add-data "dist\SlimeLauncher.exe;." slime_setup_wizard.py
          }
          New-Item -ItemType Directory -Force -Path "..\release" | Out-Null
          Copy-Item "dist\SlimeClient-Setup.exe" "..\release\" -Force
          Copy-Item "dist\SlimeLauncher.exe" "..\release\" -Force
          if (Test-Path "SlimeClient-26.2.jar") { Copy-Item "SlimeClient-26.2.jar" "..\release\" -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: SlimeClient-26.2-Release
          path: release/*
