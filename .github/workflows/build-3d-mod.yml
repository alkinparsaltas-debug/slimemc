name: Build SlimeClient 3D Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'mod/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod
        working-directory: mod
        run: |
          gradle build --no-daemon
          rm -f build/libs/*-sources.jar
          mv build/libs/*.jar build/libs/slimesocial.1.0.1.jar

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SlimeClient-3D-Mod
          path: mod/build/libs/slimesocial.1.0.1.jar
