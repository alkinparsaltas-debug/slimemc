name: Build SlimeSocial 26.2 & Relay Server

on:
  push:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-relay-server-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Create SlimeRelayServer.py
        run: |
          @'
          # -*- coding: utf-8 -*-
          import os
          import sys
          import json
          import time
          import socket
          import random
          import string
          import threading
          import urllib.request
          import tkinter as tk
          from tkinter import scrolledtext

          DEFAULT_PORT = 26262


          def get_local_ip():
              try:
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  s.connect(("8.8.8.8", 80))
                  ip = s.getsockname()[0]
                  s.close()
                  return ip
              except Exception:
                  return "127.0.0.1"


          def get_public_ip():
              for url in ("https://api.ipify.org", "https://ifconfig.me/ip"):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "SlimeRelay/1.0"})
                      return urllib.request.urlopen(req, timeout=4).read().decode("utf-8").strip()
                  except Exception:
                      pass
              return "Bulunamadı (İnternet/Güvenlik Duvarı)"


          def try_upnp_forward(port: int, local_ip: str) -> str:
              try:
                  msg = (
                      "M-SEARCH * HTTP/1.1\r\n"
                      "HOST: 239.255.255.250:1900\r\n"
                      'MAN: "ssdp:discover"\r\n'
                      "MX: 2\r\n"
                      "ST: urn:schemas-upnp-org:device:InternetGatewayDevice:1\r\n\r\n"
                  ).encode("utf-8")
                  sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  sock.settimeout(2.2)
                  sock.sendto(msg, ("239.255.255.250", 1900))
                  data, _ = sock.recvfrom(2048)
                  sock.close()
                  text = data.decode("utf-8", errors="ignore")
                  loc = ""
                  for line in text.splitlines():
                      if line.lower().startswith("location:"):
                          loc = line.split(":", 1)[1].strip()
                          break
                  if not loc:
                      return "UPnP cihazı bulunamadı (Dış ağ için modemden 26262 TCP portunu açın)"
                  xml_desc = urllib.request.urlopen(loc, timeout=3).read().decode("utf-8", errors="ignore")
                  if "WANIPConnection" in xml_desc or "WANPPPConnection" in xml_desc:
                      return "UPnP ağ geçidi algılandı (Port: " + str(port) + ")"
                  return "UPnP yanıt verdi (Port: " + str(port) + ")"
              except Exception:
                  return "Yerel ağ hazır (Dış ağ için modemden 26262 TCP portu veya tünel kullanın)"


          class RelayServerCore:
              def __init__(self, log_cb, stats_cb):
                  self.log_cb = log_cb
                  self.stats_cb = stats_cb
                  self.running = False
                  self.server_sock = None
                  self.lock = threading.Lock()
                  self.clients = {}
                  self.parties = {}

              def gen_code(self):
                  while True:
                      code = "SLM-" + "".join(random.choices(string.digits, k=4))
                      if code not in self.parties:
                          return code

              def start(self, port: int):
                  if self.running:
                      return
                  self.running = True
                  threading.Thread(target=self._accept_loop, args=(port,), daemon=True).start()

              def stop(self):
                  self.running = False
                  try:
                      if self.server_sock:
                          self.server_sock.close()
                  except Exception:
                      pass

              def _accept_loop(self, port: int):
                  try:
                      self.server_sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      self.server_sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                      self.server_sock.bind(("0.0.0.0", port))
                      self.server_sock.listen(64)
                      self.log_cb(f"[SİSTEM] Slime İletişim Sunucusu 0.0.0.0:{port} üzerinde başlatıldı.")
                      while self.running:
                          try:
                              conn, addr = self.server_sock.accept()
                              conn.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
                              threading.Thread(target=self._client_loop, args=(conn, addr), daemon=True).start()
                          except OSError:
                              break
                  except Exception as e:
                      self.log_cb(f"[HATA] Sunucu başlatılamadı: {e}")
                      self.running = False

              def _send(self, conn, obj: dict):
                  try:
                      raw = (json.dumps(obj, ensure_ascii=False) + "\n").encode("utf-8")
                      conn.sendall(raw)
                  except Exception:
                      pass

              def _broadcast_party(self, code: str):
                  party = self.parties.get(code)
                  if not party:
                      return
                  payload = {
                      "type": "PARTY_STATE",
                      "code": code,
                      "leader": party["leader"],
                      "members": list(party["members"]),
                      "target_server": party.get("target_server", ""),
                  }
                  for m in list(party["members"]):
                      c = self.clients.get(m)
                      if c:
                          self._send(c["conn"], payload)

              def _broadcast_online(self):
                  online_map = {}
                  for uname, info in self.clients.items():
                      online_map[uname] = info.get("party", "")
                  pkt = {"type": "ONLINE_USERS", "users": online_map}
                  for info in list(self.clients.values()):
                      self._send(info["conn"], pkt)
                  self.stats_cb(len(self.clients), len(self.parties))

              def _remove_from_party(self, username: str):
                  info = self.clients.get(username)
                  old_code = info.get("party") if info else None
                  if not old_code or old_code not in self.parties:
                      return
                  party = self.parties[old_code]
                  if username in party["members"]:
                      party["members"].remove(username)
                  if not party["members"]:
                      del self.parties[old_code]
                  else:
                      if party["leader"] == username:
                          party["leader"] = party["members"][0]
                      self._broadcast_party(old_code)

              def _client_loop(self, conn: socket.socket, addr):
                  username = None
                  buf = b""
                  try:
                      while self.running:
                          chunk = conn.recv(8192)
                          if not chunk:
                              break
                          buf += chunk
                          while b"\n" in buf:
                              line, buf = buf.split(b"\n", 1)
                              line = line.strip()
                              if not line:
                                  continue
                              try:
                                  msg = json.loads(line.decode("utf-8", errors="ignore"))
                              except Exception:
                                  continue
                              mtype = msg.get("type", "")

                              if mtype == "HELLO":
                                  req_user = str(msg.get("username", "Oyuncu")).strip()[:24] or "Oyuncu"
                                  with self.lock:
                                      username = req_user
                                      code = self.gen_code()
                                      self.clients[username] = {"conn": conn, "party": code, "addr": addr[0]}
                                      self.parties[code] = {
                                          "leader": username,
                                          "members": [username],
                                          "target_server": "",
                                      }
                                      self.log_cb(f"[BAĞLANDI] {username} ({addr[0]}) -> Grup: {code}")
                                      self._broadcast_party(code)
                                      self._broadcast_online()

                              elif mtype == "JOIN_PARTY" and username:
                                  target_code = str(msg.get("code", "")).strip().upper()
                                  with self.lock:
                                      if target_code not in self.parties:
                                          self._send(conn, {"type": "ERROR", "message": "Grup kodu bulunamadı: " + target_code})
                                          continue
                                      if self.clients[username]["party"] == target_code:
                                          continue
                                      self._remove_from_party(username)
                                      self.clients[username]["party"] = target_code
                                      self.parties[target_code]["members"].append(username)
                                      self.log_cb(f"[GRUP] {username} -> {target_code} grubuna katıldı.")
                                      self._broadcast_party(target_code)
                                      self._broadcast_online()

                              elif mtype == "LEAVE_PARTY" and username:
                                  with self.lock:
                                      self._remove_from_party(username)
                                      new_code = self.gen_code()
                                      self.clients[username]["party"] = new_code
                                      self.parties[new_code] = {
                                          "leader": username,
                                          "members": [username],
                                          "target_server": "",
                                      }
                                      self._broadcast_party(new_code)
                                      self._broadcast_online()

                              elif mtype == "INVITE_FRIEND" and username:
                                  target_user = str(msg.get("target", "")).strip()
                                  with self.lock:
                                      pcode = self.clients[username]["party"]
                                      tclient = self.clients.get(target_user)
                                      if tclient:
                                          self._send(tclient["conn"], {
                                              "type": "PARTY_INVITE",
                                              "from": username,
                                              "code": pcode,
                                          })
                                          self.log_cb(f"[DAVET] {username} -> {target_user} ({pcode})")

                              elif mtype == "LAUNCH_SERVER" and username:
                                  srv_ip = str(msg.get("server", "")).strip()
                                  with self.lock:
                                      pcode = self.clients[username]["party"]
                                      party = self.parties.get(pcode)
                                      if party and party["leader"] == username and srv_ip:
                                          party["target_server"] = srv_ip
                                          self.log_cb(f"[SUNUCU ÇEKME] {pcode} lideri {username} -> {srv_ip}")
                                          for m in list(party["members"]):
                                              c = self.clients.get(m)
                                              if c:
                                                  self._send(c["conn"], {
                                                      "type": "CONNECT_MC_SERVER",
                                                      "server": srv_ip,
                                                      "leader": username,
                                                  })

                              elif mtype == "PING" and username:
                                  with self.lock:
                                      pcode = self.clients[username]["party"]
                                      party = self.parties.get(pcode)
                                      if party:
                                          msg["sender"] = username
                                          for m in list(party["members"]):
                                              c = self.clients.get(m)
                                              if c:
                                                  self._send(c["conn"], msg)

                              elif mtype == "VOICE" and username:
                                  with self.lock:
                                      pcode = self.clients[username]["party"]
                                      party = self.parties.get(pcode)
                                      if party:
                                          msg["sender"] = username
                                          for m in list(party["members"]):
                                              if m != username:
                                                  c = self.clients.get(m)
                                                  if c:
                                                      self._send(c["conn"], msg)

                  except Exception:
                      pass
                  finally:
                      try:
                          conn.close()
                      except Exception:
                          pass
                      if username:
                          with self.lock:
                              if username in self.clients and self.clients[username]["conn"] == conn:
                                  self._remove_from_party(username)
                                  del self.clients[username]
                                  self.log_cb(f"[AYRILDI] {username} bağlantısı kapandı.")
                                  self._broadcast_online()


          class RelayGUI:
              def __init__(self, root: tk.Tk):
                  self.root = root
                  self.root.title("SlimeSocial İletişim & Ses Sunucusu (Hafif Arka Plan)")
                  self.root.geometry("760x520")
                  self.root.configure(bg="#050B08")

                  self.local_ip = get_local_ip()
                  self.public_ip_var = tk.StringVar(value="Sorgulanıyor...")
                  self.stats_var = tk.StringVar(value="Çevrimiçi Oyuncu: 0  •  Aktif Grup: 0  •  RAM: ~40 MB")

                  self.build_ui()
                  self.core = RelayServerCore(self.append_log, self.update_stats)
                  self.core.start(DEFAULT_PORT)

                  threading.Thread(target=self.fetch_net_info, daemon=True).start()

              def build_ui(self):
                  top = tk.Frame(self.root, bg="#08140E", padx=18, pady=14)
                  top.pack(fill="x", padx=14, pady=(14, 8))

                  tk.Label(
                      top,
                      text="SLIMESOCIAL İLETİŞİM & SES SUNUCUSU",
                      font=("Segoe UI", 15, "bold"),
                      fg="#4ADE80",
                      bg="#08140E",
                  ).pack(anchor="w")

                  tk.Label(
                      top,
                      text="Minecraft dünyası açmaz • Sadece grup kodu, arkadaşlık, işaretleme ve mesafesiz ses taşır",
                      font=("Segoe UI", 9),
                      fg="#A7F3D0",
                      bg="#08140E",
                  ).pack(anchor="w", pady=(2, 10))

                  ip_row = tk.Frame(top, bg="#0D2117", padx=12, pady=10)
                  ip_row.pack(fill="x")

                  tk.Label(
                      ip_row,
                      text=f"Kendi Bilgisayarın (Yerel):  {self.local_ip}:{DEFAULT_PORT}",
                      font=("Segoe UI", 10, "bold"),
                      fg="#ECFDF5",
                      bg="#0D2117",
                  ).pack(anchor="w")

                  pub_line = tk.Frame(ip_row, bg="#0D2117")
                  pub_line.pack(fill="x", pady=(6, 0))

                  tk.Label(
                      pub_line,
                      text="Arkadaşlarının Gireceği Adres:",
                      font=("Segoe UI", 10, "bold"),
                      fg="#86EFAC",
                      bg="#0D2117",
                  ).pack(side="left")

                  tk.Label(
                      pub_line,
                      textvariable=self.public_ip_var,
                      font=("Segoe UI", 10, "bold"),
                      fg="#22C55E",
                      bg="#0D2117",
                  ).pack(side="left", padx=(8, 12))

                  tk.Button(
                      pub_line,
                      text="Adresi Kopyala",
                      font=("Segoe UI", 9, "bold"),
                      fg="#041309",
                      bg="#22C55E",
                      relief="flat",
                      padx=10,
                      pady=3,
                      cursor="hand2",
                      command=self.copy_public_addr,
                  ).pack(side="right")

                  stat_bar = tk.Frame(self.root, bg="#08140E", padx=16, pady=8)
                  stat_bar.pack(fill="x", padx=14, pady=(0, 8))
                  tk.Label(
                      stat_bar,
                      textvariable=self.stats_var,
                      font=("Segoe UI", 9, "bold"),
                      fg="#6EE7B7",
                      bg="#08140E",
                  ).pack(side="left")

                  self.log_box = scrolledtext.ScrolledText(
                      self.root,
                      font=("Consolas", 9),
                      fg="#D1FAE5",
                      bg="#07100B",
                      insertbackground="#22C55E",
                      relief="flat",
                      bd=8,
                  )
                  self.log_box.pack(fill="both", expand=True, padx=14, pady=(0, 14))

              def fetch_net_info(self):
                  pub = get_public_ip()
                  self.root.after(0, lambda: self.public_ip_var.set(f"{pub}:{DEFAULT_PORT}"))
                  upnp_msg = try_upnp_forward(DEFAULT_PORT, self.local_ip)
                  self.append_log("[AĞ] " + upnp_msg)

              def copy_public_addr(self):
                  val = self.public_ip_var.get()
                  self.root.clipboard_clear()
                  self.root.clipboard_append(val)
                  self.append_log(f"[KOPYALANDI] {val} panoya kopyalandı.")

              def append_log(self, text: str):
                  def _ins():
                      ts = time.strftime("%H:%M:%S")
                      self.log_box.insert("end", f"[{ts}] {text}\n")
                      self.log_box.see("end")
                  self.root.after(0, _ins)

              def update_stats(self, users: int, parties: int):
                  self.root.after(
                      0,
                      lambda: self.stats_var.set(
                          f"Çevrimiçi Oyuncu: {users}  •  Aktif Grup: {parties}  •  Durum: AKTİF"
                      ),
                  )


          if __name__ == "__main__":
              root = tk.Tk()
              app = RelayGUI(root)
              root.protocol("WM_DELETE_WINDOW", lambda: (app.core.stop(), root.destroy()))
              root.mainloop()
          '@ | Out-File -FilePath slime_relay_server.py -Encoding utf8
      - name: Build SlimeRelayServer.exe
        run: pyinstaller --onefile --windowed --name SlimeRelayServer slime_relay_server.py
      - uses: actions/upload-artifact@v4
        with:
          name: SlimeRelayServer-Windows
          path: dist/SlimeRelayServer.exe

  build-slimesocial-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Generate SlimeSocial 26.2 Mod
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request, urllib.parse

          headers = {"User-Agent": "SlimeClient-Builder/26.2"}
          loader_ver = "0.20.1"
          api_ver = "0.161.0+26.2"
          loom_ver = "1.19.4"

          try:
              req = urllib.request.Request("https://meta.fabricmc.net/v2/versions/loader/26.2", headers=headers)
              loaders = json.loads(urllib.request.urlopen(req, timeout=15).read())
              loader_ver = loaders[0]["loader"]["version"]
          except Exception as e:
              print("Loader fallback:", e)

          try:
              q = urllib.parse.quote('["26.2"]')
              req = urllib.request.Request(f"https://api.modrinth.com/v2/project/fabric-api/version?game_versions={q}", headers=headers)
              apis = json.loads(urllib.request.urlopen(req, timeout=15).read())
              api_ver = apis[0]["version_number"]
          except Exception as e:
              print("API fallback:", e)

          print(f"Using Minecraft 26.2 | Loom {loom_ver} | Loader {loader_ver} | Fabric API {api_ver}")

          pkg_dir = "src/main/java/com/slimeclient/social"
          os.makedirs(pkg_dir, exist_ok=True)
          os.makedirs("src/main/resources", exist_ok=True)

          with open("settings.gradle", "w", encoding="utf-8") as f:
              f.write('''pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'SlimeSocial'
          ''')

          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write(f'''plugins {{
              id 'net.fabricmc.fabric-loom' version '{loom_ver}'
          }}

          version = '26.2-1.0.0'
          group = 'com.slimeclient'

          base {{
              archivesName = 'SlimeSocial-26.2'
          }}

          repositories {{
              mavenCentral()
              maven {{ url = 'https://maven.fabricmc.net/' }}
          }}

          dependencies {{
              minecraft "com.mojang:minecraft:26.2"
              implementation "net.fabricmc:fabric-loader:{loader_ver}"
              implementation "net.fabricmc.fabric-api:fabric-api:{api_ver}"
          }}

          java {{
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
          }}

          tasks.withType(JavaCompile).configureEach {{
              options.encoding = 'UTF-8'
              options.release = 25
          }}
          ''')

          with open("src/main/resources/fabric.mod.json", "w", encoding="utf-8") as f:
              f.write('''{
            "schemaVersion": 1,
            "id": "slimesocial",
            "version": "1.0.0",
            "name": "SlimeSocial 26.2",
            "description": "3D Orman Lobisi, Valorant Tarzi Grup Sistemi, Arkadas Listesi, Mesafesiz Ses ve Gelismis Isaretleme",
            "authors": ["SlimeClient"],
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.slimeclient.social.SlimeSocialClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "26.2",
              "fabric-api": "*"
            }
          }
          ''')

          with open(f"{pkg_dir}/RelayClient.java", "w", encoding="utf-8") as f:
              f.write(r'''package com.slimeclient.social;

          import com.google.gson.Gson;
          import com.google.gson.JsonElement;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.screens.ConnectScreen;
          import net.minecraft.client.gui.screens.TitleScreen;
          import net.minecraft.client.multiplayer.ServerData;
          import net.minecraft.client.multiplayer.resolver.ServerAddress;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;
          import java.io.InputStreamReader;
          import java.io.OutputStreamWriter;
          import java.io.PrintWriter;
          import java.lang.reflect.Constructor;
          import java.lang.reflect.Method;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Base64;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public class RelayClient {
              private static final Gson GSON = new Gson();
              public static String relayAddress = "127.0.0.1:26262";
              public static volatile boolean connected = false;
              public static volatile boolean connecting = false;
              public static volatile String connectionError = "Sunucuya bağlanılamıyor";

              public static volatile String partyCode = "YEREL-1";
              public static volatile String partyLeader = "";
              public static volatile List<String> partyMembers = new ArrayList<>();
              public static volatile String targetServerIp = "";
              public static volatile Map<String, String> onlineUsers = new HashMap<>();

              public static volatile String pendingInviteFrom = "";
              public static volatile String pendingInviteCode = "";
              public static volatile String lastToast = "";
              public static volatile long lastToastTime = 0L;

              public static List<String> friendsList = new ArrayList<>();

              private static Socket socket;
              private static PrintWriter out;
              private static Thread workerThread;
              private static int connectionEpoch = 0;

              public static void loadConfig() {
                  try {
                      File dir = new File(Minecraft.getInstance().gameDirectory, "slimesocial");
                      if (!dir.exists()) dir.mkdirs();
                      File cfg = new File(dir, "config.json");
                      if (cfg.exists()) {
                          try (FileReader r = new FileReader(cfg, StandardCharsets.UTF_8)) {
                              JsonObject obj = JsonParser.parseReader(r).getAsJsonObject();
                              if (obj.has("relayAddress")) relayAddress = obj.get("relayAddress").getAsString();
                              if (obj.has("friends")) {
                                  friendsList.clear();
                                  for (JsonElement el : obj.getAsJsonArray("friends")) {
                                      String fn = el.getAsString().trim();
                                      if (!fn.isEmpty() && !friendsList.contains(fn)) friendsList.add(fn);
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

              public static void saveConfig() {
                  try {
                      File dir = new File(Minecraft.getInstance().gameDirectory, "slimesocial");
                      if (!dir.exists()) dir.mkdirs();
                      File cfg = new File(dir, "config.json");
                      JsonObject obj = new JsonObject();
                      obj.addProperty("relayAddress", relayAddress);
                      obj.add("friends", GSON.toJsonTree(friendsList));
                      try (FileWriter w = new FileWriter(cfg, StandardCharsets.UTF_8)) {
                          GSON.toJson(obj, w);
                      }
                  } catch (Exception ignored) {}
              }

              public static void addFriend(String name) {
                  String clean = name.trim();
                  if (!clean.isEmpty() && !friendsList.contains(clean)) {
                      friendsList.add(clean);
                      saveConfig();
                  }
              }

              public static void removeFriend(String name) {
                  friendsList.remove(name);
                  saveConfig();
              }

              public static synchronized void connectAsync(String newAddr) {
                  if (newAddr != null && !newAddr.trim().isEmpty()) {
                      relayAddress = newAddr.trim();
                      saveConfig();
                  }
                  connectionEpoch++;
                  final int myEpoch = connectionEpoch;
                  connected = false;
                  connecting = true;
                  connectionError = "Sunucuya bağlanılamıyor";

                  try {
                      if (socket != null) socket.close();
                  } catch (Exception ignored) {}

                  String selfName = getSelfUsername();
                  partyLeader = selfName;
                  partyMembers = new ArrayList<>(Collections.singletonList(selfName));

                  workerThread = new Thread(() -> runLoop(myEpoch, selfName), "SlimeRelay-Net");
                  workerThread.setDaemon(true);
                  workerThread.start();
              }

              public static String getSelfUsername() {
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.getUser() != null && mc.getUser().getName() != null) {
                      return mc.getUser().getName();
                  }
                  return "SlimeOyuncu";
              }

              private static void runLoop(int epoch, String username) {
                  String host = relayAddress;
                  int port = 26262;
                  if (host.contains(":")) {
                      String[] parts = host.split(":", 2);
                      host = parts[0].trim();
                      try {
                          port = Integer.parseInt(parts[1].trim());
                      } catch (Exception ignored) {}
                  }

                  try {
                      Socket s = new Socket();
                      s.connect(new InetSocketAddress(host, port), 2500);
                      s.setTcpNoDelay(true);
                      if (epoch != connectionEpoch) {
                          s.close();
                          return;
                      }
                      socket = s;
                      out = new PrintWriter(new OutputStreamWriter(s.getOutputStream(), StandardCharsets.UTF_8), true);
                      BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));

                      connected = true;
                      connecting = false;
                      connectionError = "";

                      JsonObject hello = new JsonObject();
                      hello.addProperty("type", "HELLO");
                      hello.addProperty("username", username);
                      sendJson(hello);

                      String line;
                      while (epoch == connectionEpoch && (line = in.readLine()) != null) {
                          handlePacket(line);
                      }
                  } catch (Exception e) {
                      if (epoch == connectionEpoch) {
                          connected = false;
                          connecting = false;
                          connectionError = "Sunucuya bağlanılamıyor";
                      }
                  } finally {
                      if (epoch == connectionEpoch) {
                          connected = false;
                          connecting = false;
                          if (connectionError.isEmpty()) {
                              connectionError = "Sunucuya bağlanılamıyor";
                          }
                      }
                  }
              }

              public static void sendJson(JsonObject obj) {
                  try {
                      if (connected && out != null) {
                          out.println(GSON.toJson(obj));
                      }
                  } catch (Exception e) {
                      connected = false;
                      connectionError = "Sunucuya bağlanılamıyor";
                  }
              }

              public static void requestJoinParty(String code) {
                  if (!connected) {
                      showToast("Sunucuya bağlanılamıyor!");
                      return;
                  }
                  JsonObject obj = new JsonObject();
                  obj.addProperty("type", "JOIN_PARTY");
                  obj.addProperty("code", code.trim().toUpperCase());
                  sendJson(obj);
              }

              public static void requestLeaveParty() {
                  if (!connected) return;
                  JsonObject obj = new JsonObject();
                  obj.addProperty("type", "LEAVE_PARTY");
                  sendJson(obj);
              }

              public static void inviteFriend(String targetUser) {
                  if (!connected) {
                      showToast("Sunucuya bağlanılamıyor!");
                      return;
                  }
                  JsonObject obj = new JsonObject();
                  obj.addProperty("type", "INVITE_FRIEND");
                  obj.addProperty("target", targetUser);
                  sendJson(obj);
                  showToast(targetUser + " oyuncusuna davet gönderildi.");
              }

              public static void leaderLaunchServer(String serverIp) {
                  String ip = serverIp.trim();
                  if (ip.isEmpty()) return;
                  if (connected) {
                      JsonObject obj = new JsonObject();
                      obj.addProperty("type", "LAUNCH_SERVER");
                      obj.addProperty("server", ip);
                      sendJson(obj);
                  }
                  connectMinecraftToServer(ip);
              }

              public static void sendPing(double x, double y, double z, String title, String sub, int color) {
                  if (!connected) return;
                  JsonObject obj = new JsonObject();
                  obj.addProperty("type", "PING");
                  obj.addProperty("x", x);
                  obj.addProperty("y", y);
                  obj.addProperty("z", z);
                  obj.addProperty("title", title);
                  obj.addProperty("sub", sub);
                  obj.addProperty("color", color);
                  sendJson(obj);
              }

              public static void sendVoiceFrame(byte[] pcm, int len) {
                  if (!connected || len <= 0) return;
                  byte[] slice = new byte[len];
                  System.arraycopy(pcm, 0, slice, 0, len);
                  JsonObject obj = new JsonObject();
                  obj.addProperty("type", "VOICE");
                  obj.addProperty("data", Base64.getEncoder().encodeToString(slice));
                  sendJson(obj);
              }

              public static void showToast(String msg) {
                  lastToast = msg;
                  lastToastTime = System.currentTimeMillis();
              }

              private static void handlePacket(String raw) {
                  try {
                      JsonObject obj = JsonParser.parseString(raw).getAsJsonObject();
                      String type = obj.has("type") ? obj.get("type").getAsString() : "";

                      switch (type) {
                          case "PARTY_STATE": {
                              partyCode = obj.get("code").getAsString();
                              partyLeader = obj.get("leader").getAsString();
                              targetServerIp = obj.has("target_server") ? obj.get("target_server").getAsString() : "";
                              List<String> list = new ArrayList<>();
                              for (JsonElement el : obj.getAsJsonArray("members")) {
                                  list.add(el.getAsString());
                              }
                              partyMembers = list;
                              break;
                          }
                          case "ONLINE_USERS": {
                              Map<String, String> map = new HashMap<>();
                              JsonObject users = obj.getAsJsonObject("users");
                              for (Map.Entry<String, JsonElement> entry : users.entrySet()) {
                                  map.put(entry.getKey(), entry.getValue().getAsString());
                              }
                              onlineUsers = map;
                              break;
                          }
                          case "PARTY_INVITE": {
                              pendingInviteFrom = obj.get("from").getAsString();
                              pendingInviteCode = obj.get("code").getAsString();
                              showToast(pendingInviteFrom + " seni grubuna davet etti!");
                              break;
                          }
                          case "CONNECT_MC_SERVER": {
                              String srv = obj.get("server").getAsString();
                              Minecraft.getInstance().execute(() -> connectMinecraftToServer(srv));
                              break;
                          }
                          case "PING": {
                              String sender = obj.has("sender") ? obj.get("sender").getAsString() : "Grup";
                              if (!sender.equals(getSelfUsername())) {
                                  double x = obj.get("x").getAsDouble();
                                  double y = obj.get("y").getAsDouble();
                                  double z = obj.get("z").getAsDouble();
                                  String title = obj.get("title").getAsString();
                                  String sub = sender + " • " + obj.get("sub").getAsString();
                                  int color = obj.get("color").getAsInt();
                                  SlimeSocialClient.addRemotePing(x, y, z, title, sub, color);
                              }
                              break;
                          }
                          case "VOICE": {
                              String sender = obj.has("sender") ? obj.get("sender").getAsString() : "";
                              String b64 = obj.get("data").getAsString();
                              byte[] pcm = Base64.getDecoder().decode(b64);
                              VoiceEngine.playRemoteAudio(sender, pcm);
                              break;
                          }
                          case "ERROR": {
                              showToast(obj.get("message").getAsString());
                              break;
                          }
                      }
                  } catch (Exception ignored) {}
              }

              public static void connectMinecraftToServer(String ip) {
                  try {
                      Minecraft mc = Minecraft.getInstance();
                      ServerAddress addr = ServerAddress.parseString(ip);
                      ServerData data = createServerData("Slime Grup Sunucusu", ip);

                      for (Method m : ConnectScreen.class.getMethods()) {
                          if (m.getName().equals("startConnecting")) {
                              Class<?>[] pts = m.getParameterTypes();
                              Object[] args = new Object[pts.length];
                              for (int i = 0; i < pts.length; i++) {
                                  if (pts[i].isAssignableFrom(TitleScreen.class)) {
                                      args[i] = new TitleScreen();
                                  } else if (pts[i] == Minecraft.class) {
                                      args[i] = mc;
                                  } else if (pts[i] == ServerAddress.class) {
                                      args[i] = addr;
                                  } else if (pts[i] == ServerData.class) {
                                      args[i] = data;
                                  } else if (pts[i] == boolean.class) {
                                      args[i] = false;
                                  } else {
                                      args[i] = null;
                                  }
                              }
                              m.invoke(null, args);
                              return;
                          }
                      }
                  } catch (Exception e) {
                      showToast("Sunucuya bağlanılamıyor: " + ip);
                  }
              }

              private static ServerData createServerData(String name, String ip) throws Exception {
                  for (Constructor<?> c : ServerData.class.getConstructors()) {
                      Class<?>[] pts = c.getParameterTypes();
                      if (pts.length == 3 && pts[0] == String.class && pts[1] == String.class) {
                          if (pts[2] == boolean.class) {
                              return (ServerData) c.newInstance(name, ip, false);
                          } else if (pts[2].isEnum()) {
                              Object[] enumConsts = pts[2].getEnumConstants();
                              Object chosen = enumConsts[enumConsts.length - 1];
                              return (ServerData) c.newInstance(name, ip, chosen);
                          }
                      }
                  }
                  throw new IllegalStateException("ServerData constructor bulunamadı");
              }
          }
          ''')

          with open(f"{pkg_dir}/VoiceEngine.java", "w", encoding="utf-8") as f:
              f.write(r'''package com.slimeclient.social;

          import javax.sound.sampled.AudioFormat;
          import javax.sound.sampled.AudioSystem;
          import javax.sound.sampled.DataLine;
          import javax.sound.sampled.SourceDataLine;
          import javax.sound.sampled.TargetDataLine;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;

          public class VoiceEngine {
              private static final AudioFormat FORMAT = new AudioFormat(16000.0f, 16, 1, true, false);
              public static volatile boolean micEnabled = true;
              public static volatile boolean pushToTalkMode = false;
              public static volatile boolean pushToTalkHeld = false;
              public static volatile long selfSpeakingUntil = 0L;
              public static final Map<String, Long> speakingPlayers = new ConcurrentHashMap<>();

              private static SourceDataLine speakerLine;
              private static boolean started = false;

              public static synchronized void start() {
                  if (started) return;
                  started = true;

                  try {
                      DataLine.Info spkInfo = new DataLine.Info(SourceDataLine.class, FORMAT);
                      if (AudioSystem.isLineSupported(spkInfo)) {
                          speakerLine = (SourceDataLine) AudioSystem.getLine(spkInfo);
                          speakerLine.open(FORMAT, 6400);
                          speakerLine.start();
                      }
                  } catch (Throwable ignored) {
                      speakerLine = null;
                  }

                  Thread captureThread = new Thread(VoiceEngine::captureLoop, "SlimeVoice-Capture");
                  captureThread.setDaemon(true);
                  captureThread.start();
              }

              private static void captureLoop() {
                  TargetDataLine mic = null;
                  try {
                      DataLine.Info micInfo = new DataLine.Info(TargetDataLine.class, FORMAT);
                      if (!AudioSystem.isLineSupported(micInfo)) return;
                      mic = (TargetDataLine) AudioSystem.getLine(micInfo);
                      mic.open(FORMAT, 3200);
                      mic.start();

                      byte[] buf = new byte[640];
                      while (true) {
                          int read = mic.read(buf, 0, buf.length);
                          if (read <= 0) continue;

                          boolean shouldSend = micEnabled && (!pushToTalkMode || pushToTalkHeld);
                          if (!shouldSend || !RelayClient.connected) continue;

                          int peak = 0;
                          for (int i = 0; i + 1 < read; i += 2) {
                              int sample = (buf[i + 1] << 8) | (buf[i] & 0xFF);
                              int abs = Math.abs(sample);
                              if (abs > peak) peak = abs;
                          }

                          if (peak > 420 || (pushToTalkMode && pushToTalkHeld)) {
                              selfSpeakingUntil = System.currentTimeMillis() + 260L;
                              RelayClient.sendVoiceFrame(buf, read);
                          }
                      }
                  } catch (Throwable ignored) {
                  } finally {
                      try {
                          if (mic != null) mic.close();
                      } catch (Throwable ignored) {}
                  }
              }

              public static void playRemoteAudio(String sender, byte[] pcm) {
                  if (!sender.isEmpty()) {
                      speakingPlayers.put(sender, System.currentTimeMillis() + 300L);
                  }
                  try {
                      if (speakerLine != null && speakerLine.isOpen()) {
                          speakerLine.write(pcm, 0, pcm.length);
                      }
                  } catch (Throwable ignored) {}
              }

              public static boolean isSpeaking(String username) {
                  if (username.equals(RelayClient.getSelfUsername())) {
                      return System.currentTimeMillis() < selfSpeakingUntil;
                  }
                  Long until = speakingPlayers.get(username);
                  return until != null && System.currentTimeMillis() < until;
              }
          }
          ''')

