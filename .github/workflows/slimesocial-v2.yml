              public void startPartyTransition(String code) {
                  if (transitionPhase != 0) return;
                  this.pendingJoinCode = code;
                  this.transitionPhase = 1;
                  this.phaseStartMs = System.currentTimeMillis();
              }

              @Override
              public void tick() {
                  if (transitionPhase != 0) {
                      long elapsed = System.currentTimeMillis() - phaseStartMs;
                      if (transitionPhase == 1 && elapsed >= 1000L) {
                          transitionPhase = 2;
                          phaseStartMs = System.currentTimeMillis();
                          RelayClient.requestJoinParty(pendingJoinCode);
                      } else if (transitionPhase == 2 && elapsed >= 1000L) {
                          transitionPhase = 3;
                          phaseStartMs = System.currentTimeMillis();
                      } else if (transitionPhase == 3 && elapsed >= 1000L) {
                          transitionPhase = 0;
                      }
                  }

                  boolean isLeader = RelayClient.partyLeader.equals(RelayClient.getSelfUsername()) || RelayClient.partyMembers.size() <= 1;
                  if (this.launchBtn != null) {
                      this.launchBtn.setMessage(Component.literal(isLeader ? "▶ BAŞLAT / GİR" : "▶ TEK BAŞINA GİR"));
                  }
                  if (this.leavePartyBtn != null) {
                      this.leavePartyBtn.active = RelayClient.partyMembers.size() > 1;
                  }
              }

              private int getCurrentSlideOffsetY() {
                  if (transitionPhase == 1) {
                      float p = Mth.clamp((System.currentTimeMillis() - phaseStartMs) / 1000.0f, 0.0f, 1.0f);
                      float ease = p * p * (3.0f - 2.0f * p);
                      return -(int) (this.height * ease);
                  } else if (transitionPhase == 2) {
                      return -this.height;
                  } else if (transitionPhase == 3) {
                      float p = Mth.clamp((System.currentTimeMillis() - phaseStartMs) / 1000.0f, 0.0f, 1.0f);
                      float ease = p * p * (3.0f - 2.0f * p);
                      return -(int) (this.height * (1.0f - ease));
                  }
                  return 0;
              }

              @Override
              public void extractBackground(GuiGraphicsExtractor g, int mouseX, int mouseY, float partialTick) {
                  render3DForestPanorama(g);
                  if (transitionPhase != 2) {
                      int offsetY = getCurrentSlideOffsetY();
                      int leftW = 196;
                      int rightW = 192;
                      int rx = this.width - rightW - 10;

                      g.fill(10, 10 + offsetY, 10 + leftW, this.height - 10 + offsetY, 0xD907100B);
                      drawOutline(g, 10, 10 + offsetY, 10 + leftW, this.height - 10 + offsetY, 0xFF22C55E);

                      g.fill(rx, 10 + offsetY, rx + rightW, this.height - 10 + offsetY, 0xD907100B);
                      drawOutline(g, rx, 10 + offsetY, rx + rightW, this.height - 10 + offsetY, 0xFF16A34A);
                  }
              }

              private void render3DForestPanorama(GuiGraphicsExtractor g) {
                  int w = this.width;
                  int h = this.height;
                  double t = System.currentTimeMillis() / 1000.0;
                  double sway = Math.sin(t * 0.6) * 14.0;
                  int horizonY = (int) (h * 0.54);

                  g.fillGradient(0, 0, w, horizonY, 0xFF061610, 0xFF133A27);
                  int sunX = (int) (w * 0.52 + sway * 0.5);
                  int sunY = (int) (h * 0.22);
                  g.fill(sunX - 24, sunY - 24, sunX + 24, sunY + 24, 0x334ADE80);
                  g.fill(sunX - 14, sunY - 14, sunX + 14, sunY + 14, 0xAA86EFAC);

                  g.fillGradient(0, horizonY, w, h, 0xFF0B2918, 0xFF041009);
                  for (int row = 1; row <= 12; row++) {
                      float p = row / 12.0f;
                      int y = horizonY + (int) (Math.pow(p, 1.65) * (h - horizonY));
                      int lineCol = (row % 2 == 0) ? 0x3322C55E : 0x1A16A34A;
                      g.fill(0, y, w, y + 1, lineCol);
                  }

                  int cx = w / 2;
                  for (int i = trees.length - 1; i >= 0; i--) {
                      ForestTree tree = trees[i];
                      double scale = 18.0 / tree.z;
                      int sx = cx + (int) ((tree.x * 26.0 * scale) + sway * scale * 0.4);
                      int groundY = horizonY + (int) ((h - horizonY) * Math.min(1.0, 2.6 / tree.z));

                      int trunkW = Math.max(4, (int) (10 * scale));
                      int trunkH = Math.max(14, (int) (tree.height * 14 * scale));
                      int leafW = trunkW * 4;
                      int leafH = (int) (trunkH * 0.85);

                      g.fill(sx - trunkW / 2, groundY - trunkH, sx + trunkW / 2, groundY, 0xFF3E2723);
                      g.fill(sx, groundY - trunkH, sx + trunkW / 2, groundY, 0xFF281815);

                      int ly = groundY - trunkH;
                      g.fill(sx - leafW / 2, ly - leafH, sx + leafW / 2, ly + 4, tree.leafColor);
                      g.fill(sx - leafW / 3, ly - leafH - (leafH / 3), sx + leafW / 3, ly - leafH + 4, 0xFF22C55E);
                  }

                  for (int p = 0; p < 24; p++) {
                      double px = ((p * 97 + t * 18 * ((p % 3) + 1)) % w);
                      double py = (h * 0.18) + ((p * 53 + Math.sin(t * 1.5 + p) * 20) % (h * 0.72));
                      g.fill((int) px, (int) py, (int) px + 3, (int) py + 3, 0xAA4ADE80);
                  }
              }

              private void renderPartyCharacters(GuiGraphicsExtractor g, int offsetY) {
                  List<String> members = RelayClient.partyMembers;
                  if (members.isEmpty()) return;

                  int count = Math.min(4, members.size());
                  int cx = this.width / 2;
                  int baseY = (int) (this.height * 0.74) + offsetY;
                  int spacing = count == 1 ? 0 : (count == 2 ? 96 : 82);
                  int startX = cx - ((count - 1) * spacing) / 2;
                  double t = System.currentTimeMillis() / 1000.0;

                  for (int i = 0; i < count; i++) {
                      String name = members.get(i);
                      int px = startX + i * spacing;
                      boolean isLeader = name.equals(RelayClient.partyLeader);
                      boolean speaking = VoiceEngine.isSpeaking(name);
                      int bob = (int) Math.round(Math.sin(t * 2.4 + i) * 3.0);

                      g.fill(px - 28, baseY - 4, px + 28, baseY + 6, 0x66052E16);
                      drawOutline(g, px - 28, baseY - 4, px + 28, baseY + 6, isLeader ? 0xFF4ADE80 : 0xFF16A34A);

                      if (speaking) {
                          g.fill(px - 34, baseY - 8, px + 34, baseY + 10, 0x4422C55E);
                      }

                      int y = baseY - 4 + bob;
                      g.fill(px - 10, y - 34, px - 1, y, 0xFF1E3A8A);
                      g.fill(px + 1, y - 34, px + 10, y, 0xFF172554);

                      g.fill(px - 11, y - 68, px + 11, y - 34, 0xFF0F291E);
                      g.fill(px + 6, y - 68, px + 11, y - 34, 0xFF071710);
                      g.fill(px - 6, y - 60, px + 6, y - 48, 0xFF22C55E);

                      g.fill(px - 18, y - 68, px - 11, y - 36, 0xFF15803D);
                      g.fill(px + 11, y - 68, px + 18, y - 36, 0xFF14532D);

                      g.fill(px - 13, y - 94, px + 13, y - 68, 0xFF22C55E);
                      g.fill(px + 8, y - 94, px + 13, y - 68, 0xFF15803D);
                      g.fill(px - 8, y - 84, px - 3, y - 79, 0xFF05130A);
                      g.fill(px + 2, y - 84, px + 7, y - 79, 0xFF05130A);
                      g.fill(px - 3, y - 76, px + 2, y - 72, 0xFF05130A);

                      String tag = (isLeader ? "👑 " : "") + name + (speaking ? " 🔊" : "");
                      int tw = this.font.width(tag) + 12;
                      g.fill(px - tw / 2, y - 114, px + tw / 2, y - 99, 0xCC06110B);
                      drawOutline(g, px - tw / 2, y - 114, px + tw / 2, y - 99, isLeader ? 0xFF4ADE80 : 0xFF1E5634);
                      g.centeredText(this.font, tag, px, y - 110, 0xFFFFFFFF);
                  }
              }

              @Override
              public void extractRenderState(GuiGraphicsExtractor g, int mouseX, int mouseY, float partialTick) {
                  if (transitionPhase == 0) {
                      super.extractRenderState(g, mouseX, mouseY, partialTick);
                  } else {
                      extractBackground(g, mouseX, mouseY, partialTick);
                  }

                  int offsetY = getCurrentSlideOffsetY();

                  if (transitionPhase != 2) {
                      int rightW = 192;
                      int rx = this.width - rightW - 10;

                      g.text(this.font, "SLIME CLIENT 26.2", 16, 17 + offsetY, 0xFF4ADE80);

                      if (RelayClient.connected) {
                          g.fill(16, 30 + offsetY, 194, 43 + offsetY, 0xCC052E16);
                          g.text(this.font, "● Sunucuya Bağlı", 20, 33 + offsetY, 0xFF4ADE80);
                      } else {
                          g.fill(16, 30 + offsetY, 194, 43 + offsetY, 0xDD450A0A);
                          g.text(this.font, "⚠ Sunucuya bağlanılamıyor", 20, 33 + offsetY, 0xFFFCA5A5);
                      }

                      g.text(this.font, "GRUP KODU: " + RelayClient.partyCode, 16, 72 + offsetY, 0xFFFFFFFF);
                      g.text(this.font, "Üyeler: " + RelayClient.partyMembers.size() + "/4", 16, 84 + offsetY, 0xFF86EFAC);

                      g.text(this.font, "ARKADAŞLAR", rx + 8, 18 + offsetY, 0xFF4ADE80);

                      if (!RelayClient.pendingInviteCode.isEmpty()) {
                          g.fill(rx + 6, 56 + offsetY, rx + rightW - 6, 74 + offsetY, 0xDD064E3B);
                          g.text(this.font, "Davet: " + RelayClient.pendingInviteFrom, rx + 10, 61 + offsetY, 0xFFFFFFFF);
                      } else {
                          g.text(this.font, "Bekleyen davet yok", rx + 8, 61 + offsetY, 0xFF64748B);
                      }

                      int fy = 104 + offsetY;
                      for (String friend : RelayClient.friendsList) {
                          if (fy > this.height - 40) break;
                          boolean isOnline = RelayClient.onlineUsers.containsKey(friend);
                          int dotCol = isOnline ? 0xFF22C55E : 0xFF64748B;
                          g.text(this.font, (isOnline ? "● " : "○ ") + friend, rx + 8, fy + 2, dotCol);
                          fy += 24;
                      }

                      int bottomY = this.height - 96 + offsetY;
                      g.text(this.font, "HEDEF MİNECRAFT SUNUCUSU", 16, bottomY + 2, 0xFF86EFAC);

                      renderPartyCharacters(g, offsetY);
                  }

                  if (transitionPhase == 2) {
                      long el = System.currentTimeMillis() - phaseStartMs;
                      float p = Mth.clamp(el / 1000.0f, 0.0f, 1.0f);
                      int cx = this.width / 2;
                      int cy = this.height / 2;

                      g.fill(0, 0, this.width, this.height, 0xEE030A06);
                      int ring = (int) (30 + p * 220);
                      drawOutline(g, cx - ring, cy - ring, cx + ring, cy + ring, 0xFF22C55E);
                      int innerRing = (int) (15 + p * 120);
                      drawOutline(g, cx - innerRing, cy - innerRing, cx + innerRing, cy + innerRing, 0xFF4ADE80);

                      int bounce = (int) (Math.abs(Math.sin(p * Math.PI * 3.0)) * -26);
                      g.fill(cx - 24, cy - 24 + bounce, cx + 24, cy + 24 + bounce, 0xFF22C55E);
                      g.fill(cx - 12, cy - 8 + bounce, cx - 5, cy - 1 + bounce, 0xFF041309);
                      g.fill(cx + 5, cy - 8 + bounce, cx + 12, cy - 1 + bounce, 0xFF041309);

                      g.centeredText(this.font, "GRUBA GEÇİŞ YAPILIYOR: " + pendingJoinCode, cx, cy + 44, 0xFF4ADE80);
                  }

                  if (!RelayClient.lastToast.isEmpty() && System.currentTimeMillis() - RelayClient.lastToastTime < 3500L) {
                      int tw = this.font.width(RelayClient.lastToast) + 20;
                      int tx = (this.width - tw) / 2;
                      g.fill(tx, 14, tx + tw, 32, 0xE6052E16);
                      drawOutline(g, tx, 14, tx + tw, 32, 0xFF4ADE80);
                      g.centeredText(this.font, RelayClient.lastToast, this.width / 2, 19, 0xFFFFFFFF);
                  }
              }

              private static void drawOutline(GuiGraphicsExtractor g, int x1, int y1, int x2, int y2, int col) {
                  g.fill(x1, y1, x2, y1 + 1, col);
                  g.fill(x1, y2 - 1, x2, y2, col);
                  g.fill(x1, y1, x1 + 1, y2, col);
                  g.fill(x2 - 1, y1, x2, y2, col);
              }
          }
          ''')

          with open(f"{pkg_dir}/SlimeSocialClient.java", "w", encoding="utf-8") as f:
              f.write(r'''package com.slimeclient.social;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.Font;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.gui.screens.TitleScreen;
          import net.minecraft.core.BlockPos;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.Identifier;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.tags.FluidTags;
          import net.minecraft.util.Mth;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.projectile.ProjectileUtil;
          import net.minecraft.world.level.ClipContext;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.material.FluidState;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.EntityHitResult;
          import net.minecraft.world.phys.HitResult;
          import net.minecraft.world.phys.Vec3;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;

          public class SlimeSocialClient implements ClientModInitializer {
              public static final List<PingMarker> ACTIVE_PINGS = new ArrayList<>();
              public static boolean bypassTitleAutoOpen = false;

              public static KeyMapping lobbyKey;
              public static KeyMapping pingKey;
              public static KeyMapping pttKey;

              private static boolean wasMiddleDown = false;
              private static long middlePressMs = 0L;
              private static boolean radialOpened = false;
              private static TargetInfo cachedTarget = null;

              public enum PingPreset {
                  TARGET("HEDEF", 0xFF38BDF8, "📍"),
                  FOOD("YEMEK LAZIM", 0xFFF59E0B, "🍖"),
                  DANGER("DÜŞMAN VAR", 0xFFEF4444, "⚔"),
                  LOOT("GANİMET / SANDIK", 0xFF10B981, "💎"),
                  HELP("YARDIM LAZIM", 0xFFEAB308, "🛡"),
                  COME("BURAYA GEL", 0xFF22C55E, "🚩"),
                  BASE("ÜS / TOPLAN", 0xFFA855F7, "🏠");

                  public final String title;
                  public final int color;
                  public final String icon;

                  PingPreset(String title, int color, String icon) {
                      this.title = title;
                      this.color = color;
                      this.icon = icon;
                  }
              }

              public static class TargetInfo {
                  public final Vec3 pos;
                  public final String name;
                  public final String badge;

                  public TargetInfo(Vec3 pos, String name, String badge) {
                      this.pos = pos;
                      this.name = name;
                      this.badge = badge;
                  }
              }

              public static class PingMarker {
                  public final Vec3 pos;
                  public final String title;
                  public final String sub;
                  public final int color;
                  public final long createdMs;

                  public PingMarker(Vec3 pos, String title, String sub, int color) {
                      this.pos = pos;
                      this.title = title;
                      this.sub = sub;
                      this.color = color;
                      this.createdMs = System.currentTimeMillis();
                  }
              }

              @Override
              public void onInitializeClient() {
                  RelayClient.loadConfig();
                  RelayClient.connectAsync(RelayClient.relayAddress);
                  VoiceEngine.start();

                  lobbyKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(
                          "SlimeSocial Lobi & Grup Ekranı",
                          InputConstants.Type.KEYSYM,
                          GLFW.GLFW_KEY_G,
                          KeyMapping.Category.MISC
                  ));

                  pingKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(
                          "SlimePing İşaretle (Basılı Tut: Menü)",
                          InputConstants.Type.MOUSE,
                          GLFW.GLFW_MOUSE_BUTTON_MIDDLE,
                          KeyMapping.Category.MISC
                  ));

                  pttKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(
                          "Grup Sesli Konuşma (Bas-Konuş)",
                          InputConstants.Type.KEYSYM,
                          GLFW.GLFW_KEY_V,
                          KeyMapping.Category.MISC
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(this::onTick);
                  HudElementRegistry.addLast(Identifier.fromNamespaceAndPath("slimesocial", "hud"), (g, tickCounter) -> renderHud(g));
              }

              public static void addRemotePing(double x, double y, double z, String title, String sub, int color) {
                  synchronized (ACTIVE_PINGS) {
                      if (ACTIVE_PINGS.size() >= 12) ACTIVE_PINGS.remove(0);
                      ACTIVE_PINGS.add(new PingMarker(new Vec3(x, y, z), title, sub, color));
                  }
              }

              private void onTick(Minecraft client) {
                  long now = System.currentTimeMillis();
                  synchronized (ACTIVE_PINGS) {
                      Iterator<PingMarker> it = ACTIVE_PINGS.iterator();
                      while (it.hasNext()) {
                          if (now - it.next().createdMs > 18000L) it.remove();
                      }
                  }

                  if (client.gui.screen() instanceof TitleScreen && !bypassTitleAutoOpen) {
                      client.gui.setScreen(new SlimeLobbyScreen());
                      return;
                  }

                  while (lobbyKey.consumeClick()) {
                      if (client.gui.screen() instanceof SlimeLobbyScreen) {
                          if (client.level != null) client.gui.setScreen(null);
                      } else {
                          client.gui.setScreen(new SlimeLobbyScreen());
                      }
                  }

                  VoiceEngine.pushToTalkHeld = pttKey.isDown();

                  if (client.player == null || client.level == null || client.gui.screen() != null) {
                      wasMiddleDown = false;
                      radialOpened = false;
                      return;
                  }

                  long win = GLFW.glfwGetCurrentContext();
                  boolean isDown = win != 0L && GLFW.glfwGetMouseButton(win, GLFW.GLFW_MOUSE_BUTTON_MIDDLE) == GLFW.GLFW_PRESS;

                  if (isDown && !wasMiddleDown) {
                      wasMiddleDown = true;
                      middlePressMs = now;
                      radialOpened = false;
                      cachedTarget = scanTarget(client, 150.0);
                  } else if (isDown && wasMiddleDown) {
                      if (!radialOpened && (now - middlePressMs) >= 230L) {
                          radialOpened = true;
                          TargetInfo t = cachedTarget != null ? cachedTarget : scanTarget(client, 150.0);
                          client.gui.setScreen(new RadialPingScreen(t));
                      }
                  } else if (!isDown && wasMiddleDown) {
                      wasMiddleDown = false;
                      if (!radialOpened) {
                          TargetInfo t = cachedTarget != null ? cachedTarget : scanTarget(client, 150.0);
                          triggerPing(client, t, PingPreset.TARGET, true);
                      }
                      radialOpened = false;
                  }
              }

              public static void triggerPing(Minecraft client, TargetInfo target, PingPreset preset, boolean direct) {
                  String title = direct ? (preset.icon + " " + target.name) : (preset.icon + " " + preset.title);
                  String sub = direct ? target.badge : ("Konum: " + target.name);
                  synchronized (ACTIVE_PINGS) {
                      if (ACTIVE_PINGS.size() >= 12) ACTIVE_PINGS.remove(0);
                      ACTIVE_PINGS.add(new PingMarker(target.pos, title, sub, preset.color));
                  }
                  RelayClient.sendPing(target.pos.x, target.pos.y, target.pos.z, title, sub, preset.color);
                  if (client.player != null) {
                      client.player.playSound(SoundEvents.EXPERIENCE_ORB_PICKUP, 0.8f, 1.3f);
                  }
              }

              public static TargetInfo scanTarget(Minecraft client, double maxDist) {
                  Entity cam = client.player;
                  Level level = client.level;
                  Vec3 eye = cam.getEyePosition(1.0f);
                  Vec3 look = cam.getViewVector(1.0f);
                  Vec3 end = eye.add(look.scale(maxDist));

                  BlockHitResult bHit = level.clip(new ClipContext(eye, end, ClipContext.Block.OUTLINE, ClipContext.Fluid.ANY, cam));
                  double dist = bHit.getType() != HitResult.Type.MISS ? bHit.getLocation().distanceTo(eye) : maxDist;

                  AABB box = cam.getBoundingBox().expandTowards(look.scale(dist)).inflate(1.5);
                  EntityHitResult eHit = ProjectileUtil.getEntityHitResult(
                          cam, eye, eye.add(look.scale(dist)), box, e -> !e.isSpectator() && e.isPickable(), dist * dist
                  );

                  if (eHit != null) {
                      Entity ent = eHit.getEntity();
                      return new TargetInfo(ent.getBoundingBox().getCenter(), ent.getDisplayName().getString(), "CANLI / VARLIK");
                  }
                  if (bHit.getType() != HitResult.Type.MISS) {
                      BlockPos pos = bHit.getBlockPos();
                      Vec3 center = Vec3.atCenterOf(pos);
                      FluidState fluid = level.getFluidState(pos);
                      if (!fluid.isEmpty()) {
                          if (fluid.is(FluidTags.WATER)) return new TargetInfo(center, "Su", "SIVI ALANI");
                          if (fluid.is(FluidTags.LAVA)) return new TargetInfo(center, "Lav", "TEHLİKELİ SIVI");
                          return new TargetInfo(center, "Sıvı", "SIVI ALANI");
                      }
                      BlockState state = level.getBlockState(pos);
                      return new TargetInfo(center, state.getBlock().getName().getString(), "BLOK");
                  }
                  return new TargetInfo(eye.add(look.scale(80.0)), "Uzak Nokta", "BÖLGE");
              }

              private void renderHud(GuiGraphicsExtractor g) {
                  Minecraft client = Minecraft.getInstance();
                  if (client.player == null || client.level == null) return;
                  Font font = client.font;

                  g.fill(8, 8, 174, 42, 0xB806110B);
                  drawOutline(g, 8, 8, 174, 42, RelayClient.connected ? 0xFF22C55E : 0xFFEF4444);
                  if (RelayClient.connected) {
                      g.text(font, "● Grup: " + RelayClient.partyCode + " (" + RelayClient.partyMembers.size() + ")", 14, 13, 0xFF4ADE80);
                      g.text(font, "[G] Lobi  •  [Orta Tuş] İşaret", 14, 26, 0xFFD1FAE5);
                  } else {
                      g.text(font, "⚠ Sunucuya bağlanılamıyor", 14, 13, 0xFFFCA5A5);
                      g.text(font, "[G] Lobiye girip bağlan", 14, 26, 0xFFE2E8F0);
                  }

                  synchronized (ACTIVE_PINGS) {
                      if (ACTIVE_PINGS.isEmpty()) return;
                      int w = g.guiWidth();
                      int h = g.guiHeight();
                      Vec3 eye = client.player.getEyePosition(1.0f);
                      Vec3 fwd = client.player.getViewVector(1.0f).normalize();
                      Vec3 right = fwd.cross(new Vec3(0, 1, 0));
                      right = right.lengthSqr() < 1.0E-5 ? new Vec3(1, 0, 0) : right.normalize();
                      Vec3 up = right.cross(fwd).normalize();

                      double tanHalf = Math.tan(Math.toRadians(client.options.fov().get()) / 2.0);
                      double aspect = (double) w / (double) Math.max(1, h);
                      long now = System.currentTimeMillis();

                      for (PingMarker p : ACTIVE_PINGS) {
                          Vec3 diff = p.pos.subtract(eye);
                          double dist = diff.length();
                          if (dist < 0.5) continue;

                          double zCam = diff.dot(fwd);
                          double xCam = diff.dot(right);
                          double yCam = diff.dot(up);
                          boolean behind = zCam <= 0.1;
                          double denom = behind ? 0.1 : zCam;

                          double ndcX = xCam / (denom * tanHalf * aspect);
                          double ndcY = yCam / (denom * tanHalf);
                          if (behind) {
                              ndcX = -ndcX;
                              ndcY = -Math.abs(ndcY) - 0.5;
                          }

                          float sx = Mth.clamp((float) ((ndcX + 1.0) * 0.5 * w), 55, w - 55);
                          float sy = Mth.clamp((float) ((1.0 - ndcY) * 0.5 * h), 45, h - 45);
                          int ix = Math.round(sx);
                          int iy = Math.round(sy);

                          float pulse = (float) ((Math.sin((now - p.createdMs) / 140.0) + 1.0) * 0.5);
                          int ring = 18 + Math.round(pulse * 5);

                          drawOutline(g, ix - ring, iy - ring, ix + ring, iy + ring, p.color);
                          drawOutline(g, ix - 11, iy - 11, ix + 11, iy + 11, p.color);
                          g.fill(ix - 3, iy - 3, ix + 3, iy + 3, 0xFFFFFFFF);

                          String l1 = p.title + " • " + Math.round(dist) + "m";
                          String l2 = p.sub;
                          int bw = Math.max(font.width(l1), font.width(l2)) + 16;
                          int bx = ix - bw / 2;
                          int by = iy - ring - 30;
                          if (by < 8) by = iy + ring + 6;

                          g.fill(bx, by, bx + bw, by + 26, 0xD90B1218);
                          drawOutline(g, bx, by, bx + bw, by + 26, p.color);
                          g.centeredText(font, l1, ix, by + 4, 0xFFFFFFFF);
                          g.centeredText(font, l2, ix, by + 15, p.color);
                      }
                  }
              }

              private static void drawOutline(GuiGraphicsExtractor g, int x1, int y1, int x2, int y2, int col) {
                  g.fill(x1, y1, x2, y1 + 1, col);
                  g.fill(x1, y2 - 1, x2, y2, col);
                  g.fill(x1, y1, x1 + 1, y2, col);
                  g.fill(x2 - 1, y1, x2, y2, col);
              }

              public static class RadialPingScreen extends Screen {
                  private final TargetInfo target;
                  private final PingPreset[] opts = {
                          PingPreset.FOOD, PingPreset.DANGER, PingPreset.LOOT,
                          PingPreset.HELP, PingPreset.COME, PingPreset.BASE
                  };
                  private int hovered = -1;

                  public RadialPingScreen(TargetInfo target) {
                      super(Component.literal("SlimePing Menü"));
                      this.target = target;
                  }

                  @Override
                  public boolean isPauseScreen() {
                      return false;
                  }

                  @Override
                  public void extractBackground(GuiGraphicsExtractor g, int mx, int my, float pt) {}

                  @Override
                  public void tick() {
                      long win = GLFW.glfwGetCurrentContext();
                      boolean down = win != 0L && GLFW.glfwGetMouseButton(win, GLFW.GLFW_MOUSE_BUTTON_MIDDLE) == GLFW.GLFW_PRESS;
                      if (!down) {
                          Minecraft mc = Minecraft.getInstance();
                          if (hovered >= 0 && hovered < opts.length) {
                              triggerPing(mc, target, opts[hovered], false);
                          }
                          mc.gui.setScreen(null);
                      }
                  }

                  @Override
                  public void extractRenderState(GuiGraphicsExtractor g, int mx, int my, float pt) {
                      int cx = this.width / 2;
                      int cy = this.height / 2;
                      double dx = mx - cx;
                      double dy = my - cy;
                      if (Math.hypot(dx, dy) > 22) {
                          double a = Math.atan2(dy, dx);
                          if (a < 0) a += Math.PI * 2.0;
                          double sec = (Math.PI * 2.0) / opts.length;
                          hovered = (int) (((a + sec / 2.0) % (Math.PI * 2.0)) / sec);
                      } else {
                          hovered = -1;
                      }

                      String cTitle = "HEDEF: " + target.name;
                      int cw = Math.max(124, this.font.width(cTitle) + 18);
                      g.fill(cx - cw / 2, cy - 16, cx + cw / 2, cy + 16, 0xE60B1117);
                      drawOutline(g, cx - cw / 2, cy - 16, cx + cw / 2, cy + 16, 0xFF22C55E);
                      g.centeredText(this.font, cTitle, cx, cy - 10, 0xFFFFFFFF);
                      g.centeredText(this.font, "Seçip Orta Tuşu Bırak", cx, cy + 3, 0xFF86EFAC);

                      for (int i = 0; i < opts.length; i++) {
                          double th = (Math.PI * 2.0 * i) / opts.length;
                          int bx = cx + (int) Math.round(Math.cos(th) * 92);
                          int by = cy + (int) Math.round(Math.sin(th) * 92);
                          PingPreset p = opts[i];
                          boolean sel = (i == hovered);
                          String lbl = p.icon + " " + p.title;
                          int bw = Math.max(106, this.font.width(lbl) + 16);
                          g.fill(bx - bw / 2, by - 12, bx + bw / 2, by + 12, sel ? p.color : 0xE0101820);
                          drawOutline(g, bx - bw / 2, by - 12, bx + bw / 2, by + 12, p.color);
                          g.centeredText(this.font, lbl, bx, by - 4, sel ? 0xFF050A0E : 0xFFFFFFFF);
                      }
                      super.extractRenderState(g, mx, my, pt);
                  }
              }
          }
